name: Build and push practice Docker images

# dockerfiles/Dockerfile_* → ghcr.io/connects-scv/laidd-<slug>:latest
# The image names here must match `docker_image` in the LAIDD-Lab catalog.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Slugs to build, space-separated (e.g. gnina lip). Empty = all."
        required: false
        default: ""
  push:
    branches: [main]
    paths: ["dockerfiles/**"]

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      # ponytail: 2 at a time keeps zenodo/HF downloads from hitting rate limits.
      max-parallel: 2
      matrix:
        include:
          - { file: Dockerfile_ab3, slug: abodybuilder3 }
          - { file: Dockerfile_admet_ai, slug: admet-ai }
          - { file: Dockerfile_anthroab, slug: anthroab }
          - { file: Dockerfile_diffdock, slug: diffdock }
          - { file: Dockerfile_flowdock, slug: flowdock }
          - { file: Dockerfile_gnina, slug: gnina }
          - { file: Dockerfile_humatch, slug: humatch }
          - { file: Dockerfile_immuscope, slug: immuscope }
          - { file: Dockerfile_ligtmap, slug: ligtmap }
          - { file: Dockerfile_lip, slug: lip }
          - { file: Dockerfile_mhcflurry, slug: mhcflurry }
          - { file: Dockerfile_openfold3, slug: openfold3 }
          - { file: Dockerfile_proteinmpnn, slug: proteinmpnn }
          - { file: Dockerfile_protenix, slug: protenix }
          - { file: Dockerfile_rfd3, slug: rfdiffusion-v3 }
    steps:
      - name: Skip unselected
        id: sel
        env:
          ONLY: ${{ github.event.inputs.only }}
          SLUG: ${{ matrix.slug }}
        run: |
          if [ -z "$ONLY" ] || [[ " $ONLY " == *" $SLUG "* ]]; then echo "run=true" >> "$GITHUB_OUTPUT"; fi

      # CUDA + torch + weights images are 10–30 GB; the runner root disk has ~20 GB free.
      - name: Free disk and move Docker to /mnt
        if: steps.sel.outputs.run == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          sudo systemctl stop docker
          sudo mkdir -p /mnt/docker
          echo '{"data-root":"/mnt/docker"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker
          df -h / /mnt

      - uses: actions/checkout@v4
        if: steps.sel.outputs.run == 'true'

      - uses: docker/setup-buildx-action@v3
        if: steps.sel.outputs.run == 'true'

      - uses: docker/login-action@v3
        if: steps.sel.outputs.run == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        if: steps.sel.outputs.run == 'true'
        with:
          # The Dockerfiles need no build context; this directory is just small.
          context: dockerfiles
          file: dockerfiles/${{ matrix.file }}
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ghcr.io/connects-scv/laidd-${{ matrix.slug }}:latest
            ghcr.io/connects-scv/laidd-${{ matrix.slug }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
